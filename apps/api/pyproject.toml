[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-brand-os-api"
version = "0.1.0"
description = "HITL-first AI LinkedIn Personal Brand OS API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.140.3",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "aiosqlite==0.22.1",
  "asyncpg==0.30.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "google-genai",
  "pgvector==0.5.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
