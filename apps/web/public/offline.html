<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062b55">
  <title>You're offline · Suvacya</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f8fc;color:#10233f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:30px;border:1px solid #e1e8f0;border-radius:22px;background:#fff;text-align:center;box-shadow:0 16px 50px rgba(16,35,63,.08)}
    .mark{width:52px;height:52px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:#eaf3ff;color:#1558b0;font-size:24px;font-weight:800}
    h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#5f6f86;font-size:14px;line-height:1.6}
    button{margin-top:22px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:14px;font-weight:700}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">S</div><h1>You're offline</h1><p>Suvacya needs an internet connection to load your workspace securely. Reconnect and try again.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
