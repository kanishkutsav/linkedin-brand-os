name: Temporary backend test check

on:
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=. pytest -q tests
        working-directory: apps/api
