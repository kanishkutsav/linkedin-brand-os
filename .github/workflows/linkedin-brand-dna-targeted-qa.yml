name: LinkedIn Brand DNA Targeted QA

on:
  push:
    branches: ["feat/linkedin-auto-brand-dna"]

jobs:
  targeted-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      DATABASE_URL: sqlite+aiosqlite:///./qa.db
      SCHEDULED_JOB_KEY: qa-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run targeted LinkedIn and onboarding tests
        run: pytest -q tests/test_linkedin_whitelist_auth.py tests/test_phase7_8_linkedin.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build
