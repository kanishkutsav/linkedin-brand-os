name: LinkedIn Brand DNA Split QA

on:
  push:
    branches: ["feat/linkedin-auto-brand-dna"]

jobs:
  onboarding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      DATABASE_URL: sqlite+aiosqlite:///./qa.db
      SCHEDULED_JOB_KEY: qa-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - run: python -m compileall -q app tests
      - run: pytest -q tests/test_linkedin_whitelist_auth.py

  linkedin-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      DATABASE_URL: sqlite+aiosqlite:///./qa.db
      SCHEDULED_JOB_KEY: qa-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - run: python -m compileall -q app tests
      - run: pytest -q tests/test_phase7_8_linkedin.py
