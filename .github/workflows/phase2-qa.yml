name: Phase 2 QA
# CI verification trigger: keep this workflow on every QA-main change.

on:
  push:
    branches: ["master", "main", "phase2-qa", "phase6-durable-worker-complete", "phase7-8-qa"]
  pull_request:
    branches: ["master", "main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./qa.db
          SCHEDULED_JOB_KEY: qa-test-key
        run: pytest -q tests

  scheduler-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 2 migration shape
        run: |
          test -s supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-daily-discovery" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-calendar-generation" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-daily-retention" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand_os_render_url" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand_os_job_key" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "X-Brand-OS-Job-Key" supabase/migrations/20260925_phase2_scheduler.sql
          test -s supabase/migrations/20260925_phase2_scheduler_rollback.sql

      - name: Validate backend-only RLS for auxiliary tables
        run: |
          test -s supabase/migrations/20261101_security_rls_additional_tables.sql
          grep -q "observability_events" supabase/migrations/20261101_security_rls_additional_tables.sql
          grep -q "user_feedback" supabase/migrations/20261101_security_rls_additional_tables.sql
          grep -q "job_search_cache" supabase/migrations/20261101_security_rls_additional_tables.sql
          test -s supabase/migrations/20261101070000_scheduled_run_idempotency.sql
          grep -q "scheduled_key" supabase/migrations/20261101070000_scheduled_run_idempotency.sql
          grep -q "CREATE UNIQUE INDEX" supabase/migrations/20261101070000_scheduled_run_idempotency.sql
          test -s supabase/migrations/20261101070100_approval_published_at.sql
          grep -q "published_at" supabase/migrations/20261101070100_approval_published_at.sql
          test -s supabase/migrations/20261101070200_content_daily_idempotency.sql
          grep -q "scheduled_key" supabase/migrations/20261101070200_content_daily_idempotency.sql


  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brandos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Apply additive migrations to PostgreSQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          scheduled = Path("supabase/migrations/20261101070000_scheduled_run_idempotency.sql")
          approval = Path("supabase/migrations/20261101070100_approval_published_at.sql")
          content = Path("supabase/migrations/20261101070200_content_daily_idempotency.sql")
          assert scheduled.read_text() == Path("apps/api/app/db/migrations/20261101070000_scheduled_run_idempotency.sql").read_text()
          assert approval.read_text() == Path("apps/api/app/db/migrations/20261101070100_approval_published_at.sql").read_text()
          assert content.read_text() == Path("apps/api/app/db/migrations/20261101070200_content_daily_idempotency.sql").read_text()

          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/brandos") as conn:
              conn.execute("CREATE TABLE public.agent_runs (id bigint PRIMARY KEY)")
              conn.execute("CREATE TABLE public.approval_requests (id bigint PRIMARY KEY)")
              conn.execute("CREATE TABLE public.content_items (id bigint PRIMARY KEY, profile_id bigint NOT NULL, title varchar(200), topic varchar(300), pillar varchar(100), status varchar(50), created_at timestamptz)")
              conn.execute(scheduled.read_text())
              conn.execute(approval.read_text())
              conn.execute(content.read_text())
              columns = conn.execute(
                  "SELECT table_name, column_name FROM information_schema.columns "
                  "WHERE table_schema='public' AND "
                  "((table_name='agent_runs' AND column_name='scheduled_key') OR "
                  "(table_name='approval_requests' AND column_name='published_at') OR "
                  "(table_name='content_items' AND column_name='scheduled_key'))"
              ).fetchall()
              assert ("agent_runs", "scheduled_key") in columns
              assert ("approval_requests", "published_at") in columns
              assert ("content_items", "scheduled_key") in columns
              content_index = conn.execute(
                  "SELECT indexdef FROM pg_indexes WHERE schemaname='public' "
                  "AND tablename='content_items' AND indexname='ix_content_items_scheduled_key'"
              ).fetchone()
              assert content_index and "UNIQUE" in content_index[0] and "scheduled_key" in content_index[0]
              index = conn.execute(
                  "SELECT indexdef FROM pg_indexes WHERE schemaname='public' "
                  "AND tablename='agent_runs' AND indexname='ix_agent_runs_scheduled_key'"
              ).fetchone()
              assert index and "UNIQUE" in index[0] and "scheduled_key" in index[0]
          PY

  runtime-3-14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile application under production Python
        working-directory: apps/api
        run: python -m compileall -q app tests

  durable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 6 durable queue migration
        run: |
          test -s supabase/migrations/20260926_phase6_durable_jobs.sql
          grep -q "idempotency_key" supabase/migrations/20260926_phase6_durable_jobs.sql
          grep -q "available_at" supabase/migrations/20260926_phase6_durable_jobs.sql
          grep -q "locked_at" supabase/migrations/20260926_phase6_durable_jobs.sql
          grep -q "attempts" supabase/migrations/20260926_phase6_durable_jobs.sql
          test -s supabase/migrations/20260926_phase6_durable_jobs_rollback.sql


  phase7-linkedin-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 7 LinkedIn migration
        run: |
          test -s supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "linkedin_connections" supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "linkedin_oauth_states" supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "linkedin_oauth_exchanges" supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "published_external_id" supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "published_image_urn" supabase/migrations/20260926_phase7_linkedin_publish.sql
          grep -q "published_at" supabase/migrations/20260926_phase7_linkedin_publish.sql
          test -s supabase/migrations/20260926_phase7_linkedin_publish_rollback.sql
          test -s apps/api/app/db/migrations/20260926_phase7_linkedin_publish.sql
          test -s apps/api/app/db/migrations/20260926_phase7_linkedin_publish_rollback.sql

  phase8-cutover-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 8 cutover gates
        run: |
          test -s docs/phase8-production-cutover.md
          grep -q "scheduled jobs" docs/phase8-production-cutover.md
          grep -q "Multi-user isolation" docs/phase8-production-cutover.md
          grep -q "Render OFF procedure" docs/phase8-production-cutover.md
          grep -q "healthCheckPath: /health/ready" render.yaml
          test -s api/index.py
          test -s requirements.txt
          test -s vercel.json
          grep -q '"root": "apps/web/"' vercel.json
          grep -q '"root": "apps/api/"' vercel.json
          grep -q '"entrypoint": "app.main:app"' vercel.json
          grep -q "NEXT_PUBLIC_API_URL" apps/web/app/page.tsx
          grep -q " : '';" apps/web/app/page.tsx
          ! grep -q "onrender.com" apps/web/vercel.json
          test -s supabase/migrations/20260926_phase8_vercel_cutover.sql
          test -s supabase/migrations/20260926_phase8_vercel_cutover_rollback.sql
          grep -q "brand-os-learning-processing" supabase/migrations/20260926_phase8_vercel_cutover.sql
          grep -q "/api/internal/scheduled-jobs/learning" supabase/migrations/20260926_phase8_vercel_cutover.sql
